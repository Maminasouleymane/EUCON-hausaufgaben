<app-action-bar
  [title]="title()"
  [subtitle]="subtitle()"
  [tabs]="tabs()"
  [selectedTabIndex]="selectedTabIndex()"
  [actions]="actions()"
  (tabIndexChange)="selectedTabIndex.set($event)"
>
  <ng-content select="[filters]" filters />
</app-action-bar>

@for (tab of tabTemplates(); track tab; let i = $index) {
  @if (selectedTabIndex() === i) {
    <ng-container [ngTemplateOutlet]="tab.templateRef" />
  }
}
