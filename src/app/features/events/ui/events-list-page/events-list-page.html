<app-list-page
  title="Events"
  subtitle="Plan, track and manage all events."
  [tabs]="tabs"
  [actions]="actions"
>
  <app-filter-bar filters (resetFilters)="onResetFilters()">
    <dx-text-box
      class="filter-search"
      placeholder="Search events..."
      mode="search"
      valueChangeEvent="input"
      [value]="searchTerm()"
      [showClearButton]="true"
      (onValueChanged)="onSearchChange($event)"
    />

    <app-filter-field label="Location:">
      <dx-select-box
        [items]="locationOptions()"
        [value]="selectedLocation()"
        stylingMode="underlined"
        [showDropDownButton]="true"
        [dropDownOptions]="{ width: 'auto', minWidth: 160 }"
        (onValueChanged)="onLocationChange($event)"
      />
    </app-filter-field>

    <app-filter-field label="Status:">
      <dx-select-box
        [items]="statusOptions()"
        [value]="selectedStatus()"
        stylingMode="underlined"
        [showDropDownButton]="true"
        [dropDownOptions]="{ width: 'auto', minWidth: 160 }"
        (onValueChanged)="onStatusChange($event)"
      />
    </app-filter-field>

    <dx-date-range-box
      class="filter-date-range"
      startDatePlaceholder="Start date"
      endDatePlaceholder="End date"
      labelMode="hidden"
      [startDate]="dateRange().start"
      [endDate]="dateRange().end"
      (onValueChanged)="onDateRangeChange($event)"
    />
  </app-filter-bar>

  <ng-template appListPageTab>
    <app-data-grid
      [dataSource]="dataSource"
      [columnsDefinition]="columns()"
      [masterDetailEnabled]="true"
      [cellPrepared]="onStatusCellPrepared"
      editingMode="cell"
      storageKey="events-grid-v2"
      (ready)="onGridReady()"
      pagerInfoText="Page {0} of {1} ({2} events)"
    >
      <ng-template let-detailInfo>
        <app-event-participants [eventId]="detailInfo.key" />
      </ng-template>
    </app-data-grid>
  </ng-template>

  <ng-template appListPageTab>
    <app-events-statistics [filter]="activeFilter()" />
  </ng-template>
</app-list-page>

<app-add-event-popup
  [visible]="isAddPopupOpen()"
  [statuses]="statusesResource.value()"
  [locations]="locationsResource.value()"
  (visibleChange)="isAddPopupOpen.set($event)"
  (save)="onAddEventSave($event)"
/>
